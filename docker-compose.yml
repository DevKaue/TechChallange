services:
  db:
    image: postgres:15-alpine
    container_name: techchallenge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: oficinadb
    ports:
      - '0.0.0.0:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d oficinadb']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: techchallenge_api
    restart: unless-stopped
    command: >
      sh -c "npm run prisma:generate &&
      npm run prisma:migrate:deploy &&
      npm run prisma:seed &&
      DATABASE_URL=postgresql://admin:adminpassword@db:5432/oficinadb_test npx prisma migrate deploy &&
      npm run start:dev"
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/oficinadb?schema=public
      - JWT_SECRET=techchallenge_secret_key_2026
      - PORT=3000
      - NODE_ENV=development
      - PASSWORD_SALT=4a7b1e8f9c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./backend/prisma:/usr/src/app/prisma
      - ./backend/test:/usr/src/app/test
      - ./backend/coverage:/usr/src/app/coverage
      - ./backend/scripts:/usr/src/app/scripts
      - ./backend/package.json:/usr/src/app/package.json
      - ./backend/package-lock.json:/usr/src/app/package-lock.json
      - /usr/src/app/node_modules

  sonar_db:
    image: postgres:15-alpine
    container_name: techchallenge_sonar_db
    profiles:
      - quality
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data # Alterado para volume nomeado (evita erro de permissão)
    healthcheck: # Adicionado para o SonarQube não tentar conectar antes da hora
      test: ['CMD-SHELL', 'pg_isready -U sonar -d sonar']
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: techchallenge_sonarqube
    profiles:
      - quality
    restart: unless-stopped
    depends_on:
      sonar_db:
        condition: service_healthy # Ajustado para esperar o banco estar pronto
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: